name: Build and Deploy Grantvera

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # govulncheck is PINNED, not @latest. Every step in this job gates the image
  # build, so a new release that reports a finding the previous one did not
  # would stop a deploy that has nothing to do with the change being pushed.
  # Bump this deliberately and read the diff, rather than being bumped by it.
  GOVULNCHECK_VERSION: v1.8.0

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      # Formatting and vet run BEFORE the tests: both finish in under a second,
      # and there is no reason to spend the test run's seconds discovering a
      # problem that a byte comparison already knows about.
      #
      # gofmt compares the bytes on disk, so this check only means anything on
      # an LF checkout. .gitattributes pins *.go to eol=lf precisely so that a
      # Windows worktree cannot make this list a file that is byte-identical to
      # a clean one. Measured before adding this step: the six tracked .go files
      # taken from the index are gofmt-clean, while the same files in a CRLF
      # worktree were all listed — a false positive that costs a diagnosis
      # every time it fires.
      - name: Check formatting
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-clean:"
            echo "$unformatted"
            echo
            echo "run gofmt on an LF copy, never 'gofmt -w' on a CRLF worktree"
            exit 1
          fi
          echo "all Go files are gofmt-clean"

      # go vet finds what the compiler does not: Printf verbs that do not match
      # their arguments, a lock copied by value, unreachable code. None of those
      # stop a build, and all of them ship.
      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      # govulncheck reports known vulnerabilities in the standard library and in
      # dependencies, but only for code paths this module actually reaches — so
      # a finding here is one that affects this binary, not a theoretical entry
      # in a database.
      #
      # It runs after the tests rather than before because it is the slowest of
      # the three checks and the one least likely to fire: this module has no
      # external dependencies at all, so in practice it watches the Go version
      # the Dockerfile's golang:1.26-alpine builder resolves to.
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}
          govulncheck ./...

      - name: Check inline JavaScript
        run: |
          # go vet does not see the JavaScript embedded in index.html, so a
          # missing bracket there ships green and breaks the page at runtime.
          # Each <script> block is extracted and parsed with node --check.
          # A file that exists but yields no checkable block fails the build:
          # silently checking nothing is the failure mode this guards against.
          set -euo pipefail
          html=""
          for candidate in index.html web/index.html; do
            if [ -f "$candidate" ]; then html="$candidate"; break; fi
          done
          if [ -z "$html" ]; then
            echo "no index.html found - nothing to check"
            exit 0
          fi
          echo "checking $html"
          tmp=$(mktemp -d)
          node -e '
            const fs = require("fs"), path = require("path");
            const html = fs.readFileSync(process.argv[1], "utf8");
            const dir = process.argv[2];
            const re = /<script\b([^>]*)>([\s\S]*?)<\/script>/gi;
            let m, i = 0;
            while ((m = re.exec(html)) !== null) {
              const attrs = m[1], body = m[2];
              if (body.trim() === "") continue;
              if (/\stype\s*=\s*["\x27](?!text\/javascript|module)/i.test(attrs)) continue;
              const isModule = /\stype\s*=\s*["\x27]module["\x27]/i.test(attrs);
              i += 1;
              fs.writeFileSync(path.join(dir, "block" + i + (isModule ? ".mjs" : ".js")), body);
            }
            console.log(i);
          ' "$html" "$tmp" > "$tmp/count"
          n=$(cat "$tmp/count")
          if [ "$n" -eq 0 ]; then
            echo "$html contains no inline script block - refusing to pass silently"
            exit 1
          fi
          for f in "$tmp"/block*; do
            node --check "$f"
          done
          echo "$n inline block(s) parse"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max