name: Build and Deploy Grantvera

# Two jobs. "validate" runs every check on every trigger and holds read-only
# permissions only. "publish" runs only after validate passed, only on refs/heads/main,
# and is the only job that holds package write permission. Watchtower on the
# server deploys whatever :latest points at, so :latest must only ever move
# from main, and the job that can write it must not run any test code.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # govulncheck is PINNED, not @latest. Every step in this job gates the image
  # build, so a new release that reports a finding the previous one did not
  # would stop a deploy that has nothing to do with the change being pushed.
  # Bump this deliberately and read the diff, rather than being bumped by it.
  GOVULNCHECK_VERSION: v1.8.0

jobs:
  validate:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      # The checkout no longer fetches Git LFS objects. The only LFS-tracked
      # file was the vendored CLI binary, which is gone: the Dockerfile builds
      # the CLI from a pinned upstream commit instead.
      # persist-credentials is off: nothing in this job pushes to git.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # Formatting and vet run BEFORE the tests: both finish in under a second,
      # and there is no reason to spend the test run's seconds discovering a
      # problem that a byte comparison already knows about.
      #
      # gofmt compares the bytes on disk, so this check only means anything on
      # an LF checkout. .gitattributes pins *.go to eol=lf precisely so that a
      # Windows worktree cannot make this list a file that is byte-identical to
      # a clean one. Measured before adding this step: the six tracked .go files
      # taken from the index are gofmt-clean, while the same files in a CRLF
      # worktree were all listed — a false positive that costs a diagnosis
      # every time it fires.
      - name: Check formatting
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-clean:"
            echo "$unformatted"
            echo
            echo "run gofmt on an LF copy, never 'gofmt -w' on a CRLF worktree"
            exit 1
          fi
          echo "all Go files are gofmt-clean"

      # go vet finds what the compiler does not: Printf verbs that do not match
      # their arguments, a lock copied by value, unreachable code. None of those
      # stop a build, and all of them ship.
      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      # govulncheck reports known vulnerabilities in the standard library and in
      # dependencies, but only for code paths this module actually reaches — so
      # a finding here is one that affects this binary, not a theoretical entry
      # in a database.
      #
      # It runs after the tests rather than before because it is the slowest of
      # the three checks and the one least likely to fire: this module has no
      # external dependencies at all, so in practice it watches the Go version
      # the Dockerfile's golang:1.26-alpine builder resolves to.
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}
          govulncheck ./...

      - name: Check inline JavaScript
        run: |
          # go vet does not see the page's JavaScript, so a missing bracket
          # there ships green and breaks the page at runtime. The code lives in
          # app.js (classic script) and app-module.js (ES module); both are
          # parsed with node --check, the module one as a module through an
          # .mjs copy. A missing file fails the build: silently checking
          # nothing is the failure mode this guards against. An inline
          # <script> body in index.html fails it too, because the CSP
          # (script-src without 'unsafe-inline') would refuse to run it.
          set -euo pipefail
          for f in index.html app.js app-module.js; do
            if [ ! -f "$f" ]; then
              echo "$f is missing - refusing to pass silently"
              exit 1
            fi
          done
          node -e '
            const html = require("fs").readFileSync(process.argv[1], "utf8");
            const re = /<script\b([^>]*)>([\s\S]*?)<\/script>/gi;
            let m, n = 0;
            while ((m = re.exec(html)) !== null) {
              if (m[2].trim() === "") continue;
              n += 1;
              console.log("inline <script> block at offset " + m.index + ": <script" + m[1] + ">");
            }
            if (n > 0) {
              console.log(process.argv[1] + " contains " + n + " inline script block(s); move the code to a .js file");
              process.exit(1);
            }
          ' index.html
          tmp=$(mktemp -d)
          cp app-module.js "$tmp/app-module.mjs"
          node --check app.js
          node --check "$tmp/app-module.mjs"
          echo "app.js and app-module.js parse; index.html has no inline script block"

      # go test does not run the node tests in tools/. "|| exit 1" fails the
      # step on the first failing test without relying on the shell's -e.
      - name: Run JS tests
        run: |
          for t in tools/*_test.js; do echo "== $t"; node "$t" || exit 1; done

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The image carries the upstream commit its CLI was built from as the
      # label org.pubvera.cli.commit. On pubvera-recallis that label once
      # shipped EMPTY (an ARG default that never reached the runtime stage)
      # while the build, the tests and the deploy were all green. So this
      # builds the image locally first and compares the label with the commit
      # pinned in the Dockerfile, BEFORE anything is pushed. A mismatch stops
      # the job, so an image that cannot say where its CLI came from never
      # reaches :latest.
      #
      # This job never pushes. The publish job rebuilds the same Dockerfile
      # from the gha cache this build fills.
      - name: Build image for the label check
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: grantvera-label-check:ci
          cache-from: type=gha

      - name: Check the CLI commit label
        run: |
          set -euo pipefail
          expected=$(sed -n 's/^ARG PP_LIBRARY_COMMIT=//p' Dockerfile)
          actual=$(docker image inspect grantvera-label-check:ci --format '{{ index .Config.Labels "org.pubvera.cli.commit" }}')
          echo "expected: ${expected}"
          echo "actual:   ${actual}"
          if ! printf '%s' "$expected" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Dockerfile has no global 'ARG PP_LIBRARY_COMMIT=<40-hex commit>' line"
            exit 1
          fi
          if [ "$actual" != "$expected" ]; then
            echo "label org.pubvera.cli.commit does not match the commit pinned in the Dockerfile"
            exit 1
          fi
          echo "label matches the pinned commit"

      # The server ran as root (UID 0, measured on the host with docker top on
      # 2026-10-10). This starts the image exactly as it ships, waits for
      # /healthz, and then reads the UID of PID 1 from /proc — the running
      # process, not just the image's USER setting. Order matters: a server
      # that cannot start is reported as a start failure, not as a UID failure.
      - name: Check the image runs as non-root
        run: |
          set -euo pipefail
          want=10001
          cid=$(docker run -d grantvera-label-check:ci)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          healthy=0
          for i in $(seq 1 30); do
            if docker exec "$cid" wget -q -O /dev/null "http://localhost:8095/healthz"; then
              healthy=1
              break
            fi
            sleep 1
          done
          if [ "$healthy" -ne 1 ]; then
            echo "server did not answer /healthz within 30 s"
            docker logs "$cid" || true
            exit 1
          fi
          echo "healthz answered"
          uid=$(docker exec "$cid" awk '/^Uid:/ {print $2}' /proc/1/status)
          echo "expected uid: ${want}"
          echo "actual uid:   ${uid}"
          if [ "$uid" != "$want" ]; then
            echo "PID 1 runs as uid ${uid}, not ${want}"
            exit 1
          fi
          echo "PID 1 runs as non-root"

  # Runs only after every check in validate passed. Only this job holds the
  # package write permission, and it runs no test code of its own: it builds the
  # same Dockerfile from the same commit and pushes it.
  publish:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
